<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">UWB for Drone system architecture</title><desc id="desc">Four stationary STM32F103 and DW1000 Anchors exchange double-sided ranging messages with one mobile STM32 Tag. The Tag calibrates and filters ranges and sends binary telemetry at 115200 baud. A browser reads UART directly through a serial adapter, or an ESP32-S3 bridge parses it and sends JSON over WebSocket port 81. The browser estimates 2D position from fresh valid ranges.</desc>
